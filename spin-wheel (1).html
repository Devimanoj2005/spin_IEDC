<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel - Interactive Decision Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #2e1065, #0f172a 80%);
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #fbbf24;
            --accent-hover: #f59e0b;
            --danger: #f43f5e;
            --panel-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 40px;
        }

        /* Top Header Navigation */
        header {
            width: 100%;
            max-width: 1100px;
            padding: 20px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title h1 {
            font-size: clamp(20px, 4vw, 28px);
            font-weight: 800;
            background: linear-gradient(135deg, #fde68a, #fbbf24, #f43f5e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .icon-btn.active {
            border-color: var(--accent);
            background: rgba(251, 191, 36, 0.15);
        }

        /* Main Grid Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 32px;
            width: 100%;
            max-width: 1100px;
            padding: 0 24px;
            margin-top: 10px;
        }

        @media (min-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr 360px;
            }
        }

        /* Wheel Area */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            position: relative;
        }

        .wheel-wrap {
            position: relative;
            width: min(88vw, 440px);
            height: min(88vw, 440px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 56px;
            z-index: 20;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.6));
            transition: transform 0.1s ease;
        }

        .pointer.tick {
            transform: translateX(-50%) rotate(-8deg);
        }

        .wheel-outer {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 12px;
            background: conic-gradient(from 0deg, #fbbf24, #ec4899, #8b5cf6, #3b82f6, #fbbf24);
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.2);
        }

        #wheelSvg {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0f172a;
            will-change: transform;
        }

        .hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fffbeb, #fde68a, #f59e0b);
            border: 4px solid #ffffff;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            font-weight: 800;
            font-size: 16px;
            color: #78350f;
            letter-spacing: 1.5px;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            user-select: none;
        }

        .hub:hover {
            transform: translate(-50%, -50%) scale(1.08);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        .hub:active {
            transform: translate(-50%, -50%) scale(0.94);
        }

        .hub.disabled {
            cursor: not-allowed;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Result display below wheel */
        .result-bar {
            width: 100%;
            max-width: 440px;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
        }

        .result-card.show {
            opacity: 1;
            transform: translateY(0);
        }

        .result-card span.winner-name {
            color: var(--accent);
            font-size: 22px;
            font-weight: 800;
            margin-left: 6px;
        }

        /* Sidebar Control Panel */
        .sidebar {
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 600px;
        }

        .tab-headers {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 4px;
            gap: 4px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 700;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Custom Input Section */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        textarea.items-input {
            width: 100%;
            height: 140px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-primary);
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s ease;
        }

        textarea.items-input:focus {
            border-color: var(--accent);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        .btn-secondary {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        /* Presets chips */
        .preset-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(251, 191, 36, 0.1);
        }

        /* Settings Checkboxes */
        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .setting-item input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* History List */
        .history-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
        }

        .history-item .item-title {
            font-weight: 700;
            color: var(--text-primary);
        }

        .history-item .item-time {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .empty-history {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 20px 0;
        }

        /* Winner Celebration Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: linear-gradient(145deg, #1e1b4b, #0f172a);
            border: 1px solid rgba(251, 191, 36, 0.4);
            border-radius: 24px;
            padding: 36px 32px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(251, 191, 36, 0.2);
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 56px;
            margin-bottom: 12px;
            animation: bounce 1s infinite alternate ease-in-out;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .modal-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .modal-winner {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent);
            word-break: break-word;
            margin-bottom: 24px;
        }

        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fde68a, #f59e0b);
            border: none;
            color: #451a03;
            font-weight: 800;
            font-size: 15px;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
        }

        /* Confetti particle canvas */
        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1001;
        }
    </style>
</head>

<body>

    <!-- Header Navigation -->
    <header>
        <div class="logo-title">
            <span style="font-size: 28px;">🎡</span>
            <h1>Spin the Wheel</h1>
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound">
                <span id="soundIcon">🔊</span> Sound
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-layout">
        <!-- Wheel Display Section -->
        <section class="wheel-section">
            <div class="wheel-wrap">
                <svg class="pointer" id="pointerPin" viewBox="0 0 48 56">
                    <path d="M24 56 L2 12 Q2 0 14 0 L34 0 Q46 0 46 12 Z" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5" />
                </svg>
                <div class="wheel-outer">
                    <svg id="wheelSvg" viewBox="0 0 400 400"></svg>
                </div>
                <div class="hub" id="spinBtn">SPIN</div>
            </div>

            <div class="result-bar">
                <div class="result-card" id="resultCard">
                    🎉 Landed on: <span class="winner-name" id="resultText">--</span>
                </div>
            </div>
        </section>

        <!-- Sidebar Control Panel -->
        <aside class="sidebar">
            <div class="tab-headers">
                <button class="tab-btn active" data-tab="tab-options">⚙️ Wheel Inputs</button>
                <button class="tab-btn" data-tab="tab-history">📜 History</button>
            </div>

            <!-- Tab 1: Wheel Options -->
            <div class="tab-content active" id="tab-options">
                <div class="input-group">
                    <label for="itemsInput">Wheel Choices (One per line)</label>
                    <textarea class="items-input" id="itemsInput" placeholder="Enter options here..."></tex
