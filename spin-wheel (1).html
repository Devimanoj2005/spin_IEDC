<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the Wheel</title>
<style>
  :root {
    --bg1: #1e1b4b;
    --bg2: #4c1d95;
    --card: rgba(255,255,255,0.06);
    --text: #f8fafc;
    --accent: #fbbf24;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 20%, var(--bg2), var(--bg1) 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    padding: 24px;
    overflow-x: hidden;
  }
  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    margin: 0;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 800;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .wheel-wrap {
    position: relative;
    width: min(90vw, 420px);
    height: min(90vw, 420px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 54px;
    z-index: 10;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
  }
  .wheel-outer {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    padding: 10px;
    background: conic-gradient(from 0deg, #fbbf24, #f472b6, #fbbf24);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,255,255,0.1);
  }
  #wheel {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #0f172a;
    transition: transform 5.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);
  }
  .hub {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fde68a, #f59e0b);
    border: 4px solid #fff;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 5;
    font-weight: 800;
    font-size: 15px;
    color: #451a03;
    letter-spacing: 1px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
  }
  .hub:hover { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 8px 22px rgba(0,0,0,0.5); }
  .hub:active { transform: translate(-50%, -50%) scale(0.96); }
  .hub.disabled { cursor: not-allowed; opacity: 0.7; }
  .hub.disabled:hover { transform: translate(-50%, -50%) scale(1); }

  .result-box {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .result-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(6px);
    padding: 14px 28px;
    border-radius: 16px;
    font-size: 20px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(8px) scale(0.95);
    transition: all 0.4s ease;
  }
  .result-card.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    animation: pop 0.5s ease;
  }
  .result-card .win-label { color: var(--accent); }
  @keyframes pop {
    0% { transform: scale(0.8); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .confetti {
    position: fixed;
    top: -10px;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    z-index: 100;
    pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }

  .glow {
    animation: glowPulse 1.4s ease-in-out 3;
  }
  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 0px rgba(251,191,36,0)); }
    50% { filter: drop-shadow(0 0 22px rgba(251,191,36,0.9)); }
  }

  @media (max-width: 420px) {
    .hub { width: 62px; height: 62px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎡 Spin the Wheel</h1>

  <div class="wheel-wrap" id="wheelWrap">
    <svg class="pointer" viewBox="0 0 46 54">
      <path d="M23 54 L2 10 Q2 0 12 0 L34 0 Q44 0 44 10 Z" fill="#f43f5e" stroke="#fff" stroke-width="2"/>
    </svg>
    <div class="wheel-outer">
      <svg id="wheel" viewBox="0 0 400 400"></svg>
    </div>
    <div class="hub" id="spinBtn">SPIN</div>
  </div>

  <div class="result-box">
    <div class="result-card" id="resultCard">
      🎉 You got: <span class="win-label" id="resultText"></span>
    </div>
  </div>
</div>

<script>
const segments = [
  { label: "1", color: "#f43f5e" },
  { label: "2", color: "#6366f1" },
  { label: "3", color: "#10b981" },
  { label: "4", color: "#f59e0b" },
  { label: "5", color: "#06b6d4" },
  { label: "6", color: "#ec4899" },
  { label: "7", color: "#84cc16" },
  { label: "8", color: "#a855f7" }
];

const n = segments.length;
const anglePer = 360 / n;
const svg = document.getElementById('wheel');
const cx = 200, cy = 200, r = 195;

function polarToCartesian(cx, cy, r, angleDeg) {
  const a = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function describeSlice(startAngle, endAngle) {
  const start = polarToCartesian(cx, cy, r, endAngle);
  const end = polarToCartesian(cx, cy, r, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return `M ${cx} ${cy} L ${start.x.toFixed(2)} ${start.y.toFixed(2)} A ${r} ${r} 0 ${largeArc} 0 ${end.x.toFixed(2)} ${end.y.toFixed(2)} Z`;
}

let svgMarkup = '';
segments.forEach((seg, i) => {
  const startAngle = i * anglePer;
  const endAngle = startAngle + anglePer;
  const midAngle = startAngle + anglePer / 2;
  const path = describeSlice(startAngle, endAngle);

  svgMarkup += `<path d="${path}" fill="${seg.color}" stroke="#0f172a" stroke-width="2.5"/>`;

  // curved text path per slice, following the arc near the outer edge
  const textR = r * 0.72;
  const arcId = `arcPath${i}`;
  const arcStart = polarToCartesian(cx, cy, textR, startAngle + 4);
  const arcEnd = polarToCartesian(cx, cy, textR, endAngle - 4);
  const largeArc = (endAngle - startAngle) > 180 ? 1 : 0;

  svgMarkup += `<path id="${arcId}" d="M ${arcStart.x.toFixed(2)} ${arcStart.y.toFixed(2)} A ${textR} ${textR} 0 ${largeArc} 1 ${arcEnd.x.toFixed(2)} ${arcEnd.y.toFixed(2)}" fill="none" />`;
  svgMarkup += `<text font-size="15" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      <textPath href="#${arcId}" startOffset="50%" text-anchor="middle">${seg.label}</textPath>
    </text>`;
});

// outer bold border
svgMarkup += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#fde68a" stroke-width="5"/>`;

svg.innerHTML = svgMarkup;

let currentRotation = 0;
let spinning = false;
const spinBtn = document.getElementById('spinBtn');
const wheelWrap = document.getElementById('wheelWrap');
const resultCard = document.getElementById('resultCard');
const resultText = document.getElementById('resultText');

function launchConfetti() {
  const colors = segments.map(s => s.color);
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 1.5) + 's';
    c.style.width = c.style.height = (6 + Math.random() * 6) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

spinBtn.addEventListener('click', () => {
  if (spinning) return;
  spinning = true;
  spinBtn.classList.add('disabled');
  resultCard.classList.remove('show');
  wheelWrap.classList.remove('glow');

  const winningIndex = Math.floor(Math.random() * n);
  // The pointer is fixed at top (0deg / 12 o'clock).
  // We want the middle of the winning segment to land at 0deg (adjusted for rotation).
  const segMid = winningIndex * anglePer + anglePer / 2;
  const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 full spins
  // Target rotation such that segment mid ends up at top (0deg), accounting for current rotation offset
  const randomJitter = (Math.random() - 0.5) * (anglePer * 0.4); // stay within slice, avoid edges
  const targetMod = (360 - segMid + randomJitter + 360) % 360;
  const currentMod = ((currentRotation % 360) + 360) % 360;
  let delta = targetMod - currentMod;
  if (delta < 0) delta += 360;
  const newRotation = currentRotation + extraSpins * 360 + delta;

  currentRotation = newRotation;
  svg.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(() => {
    spinning = false;
    spinBtn.classList.remove('disabled');
    resultText.textContent = segments[winningIndex].label;
    resultCard.classList.add('show');
    wheelWrap.classList.add('glow');
    launchConfetti();
  }, 5300);
});
</script>
</body>
</html>
